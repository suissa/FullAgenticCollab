version: 0.2.0
contribution_model: validated-reason-development
profiles:
  local:
    ownership: contributor
    required: [contribution-manifest, reproduction, prompt-provenance]
    scope: contribution-package
    allow_not_applicable: true
  dev:
    ownership: contributor-ci
    required: [code-free-contribution, secret-scan, workflow-guard]
    scope: contribution-package
    allow_not_applicable: false
  stage:
    ownership: upstream
    required: [unit, integration, e2e, security]
    scope: generated-candidate-and-affected-system
    allow_not_applicable: false
  tests:
    ownership: upstream-test-plane
    required: [problem-proof, solution-proof, unchanged-reproduction]
    mode: causal-control-treatment
    scope: canonical-base-and-generated-candidate
    allow_not_applicable: false
  qualification:
    ownership: upstream
    required: [problem-proof, solution-proof, unit, integration, e2e, security, benchmark, load, stress, chaos]
    mode: evidence-closure
    reuse_valid_evidence: true
  upstream:
    ownership: upstream
    required: [qualified-generated-revision, review-observation]
