name: FACoP Stage Profile
on:
  push:
    branches: ['*-stage']
  pull_request:
    branches: ['*-stage']
permissions:
  contents: read
jobs:
  upstream-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Unit + Integration + E2E + Security
        run: npm run test:stage
