name: FACoP Stage Profile
on:
  push:
    branches: ['*-stage']
  pull_request:
    branches: ['*-stage']
permissions:
  contents: read
jobs:
  upstream-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Unit + Integration + E2E + Security
        run: npm run test:stage

  acceptance-verifier:
    # The program that decides autonomous acceptance is itself upstream-owned acceptance
    # evidence: it must be proven before it is trusted to decide anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Install the Zig toolchain
        # The ziglang wheel ships the whole toolchain, pinned by version, with no
        # third-party Action to trust or SHA-pin.
        run: |
          pip install --no-cache-dir ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
      - name: Verifier unit tests, build, and end-to-end decision paths
        run: npm run test:review-tool
