name: FACoP Semantic Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate schema documents
        run: node scripts/schema-validator.ts
      - name: Validate semantic test vectors
        run: npm run test:semantic
      - name: Run semantic integration tests
        run: node --test tests/integration/semantic-rfc.test.ts
