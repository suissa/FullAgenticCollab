name: FACoP Dev Profile
on:
  push:
    branches: ['*-dev']
permissions:
  contents: read
jobs:
  changed-action-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Detect changed atomic actions
        id: scope
        shell: bash
        run: echo "actions=$(node scripts/changed-actions.ts HEAD^ HEAD)" >> "$GITHUB_OUTPUT"
      - name: Unit evidence for changed actions
        env: { FACOP_CHANGED_ACTIONS: '${{ steps.scope.outputs.actions }}' }
        run: npm run test:unit
      - name: Characterize changed actions
        if: steps.scope.outputs.actions != ''
        env: { FACOP_CHANGED_ACTIONS: '${{ steps.scope.outputs.actions }}' }
        run: npm run characterize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: facop-dev-evidence, path: .facop/evidence, if-no-files-found: ignore }
