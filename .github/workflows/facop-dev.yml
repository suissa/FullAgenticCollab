name: FACoP Dev Profile
on:
  push:
    branches: ['*-dev']
permissions:
  contents: read
jobs:
  contribution-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Secret scan (includes contribution prompt/context)
        run: npm run test:secrets
      - name: Trust-plane guard
        run: npm run test:workflows
      - name: Enforce code-free Validated Reason contribution
        if: ${{ hashFiles('contribution/contribution.json') != '' }}
        run: npm run vrd:guard -- --bundle=contribution --base=origin/main
      - name: Detect changed atomic actions (legacy/internal maintainer path)
        id: scope
        shell: bash
        run: echo "actions=$(node scripts/changed-actions.ts HEAD^ HEAD)" >> "$GITHUB_OUTPUT"
      - name: Unit evidence for changed actions
        if: ${{ hashFiles('contribution/contribution.json') == '' }}
        env: { FACOP_CHANGED_ACTIONS: '${{ steps.scope.outputs.actions }}' }
        run: npm run test:unit
      - name: Characterize changed actions
        if: ${{ hashFiles('contribution/contribution.json') == '' && steps.scope.outputs.actions != '' }}
        env: { FACOP_CHANGED_ACTIONS: '${{ steps.scope.outputs.actions }}' }
        run: npm run characterize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: facop-dev-evidence, path: .facop/evidence, if-no-files-found: ignore }
