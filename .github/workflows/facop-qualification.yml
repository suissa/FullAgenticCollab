name: FACoP Qualification Profile
on:
  push:
    branches: ['*-qualification']
permissions:
  contents: read
  actions: read
jobs:
  evidence-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Restore Validated Reason proof from tests profile
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=facop-validated-reason-proof&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$ID" ]; then
            echo "No facop-validated-reason-proof artifact found; qualification requires tests-profile ProblemProof/SolutionProof." >&2
            exit 1
          fi
          mkdir -p .facop/validated-reason
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/facop-vrd.zip
          unzip -q /tmp/facop-vrd.zip -d .facop/validated-reason
          test -f .facop/validated-reason/validated-reason.json
          echo "Validated Reason proof restored from artifact $ID"
      - name: Restore previous Evidence Passport
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=facop-evidence-passport&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$ID" ]; then
            mkdir -p .facop/previous
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/facop-previous.zip
            unzip -q /tmp/facop-previous.zip -d .facop/previous
            echo "Previous Evidence Passport restored from artifact $ID"
          fi
      - name: Verify previous Evidence Passport attestation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .facop/previous/passport.att.json ]; then
            node scripts/verify-attestation.ts .facop/previous/passport.att.json qualification
          elif [ -f .facop/previous/passport.json ]; then
            echo "Previous passport carries no attestation; discarding it. All evidence will be re-executed."
            rm -rf .facop/previous
          else
            echo "No previous Evidence Passport; qualification will execute all characterization evidence."
          fi
      - name: Qualify revision
        env:
          FACOP_CHARACTERIZATION_SCALE: 2
          FACOP_PREVIOUS_PASSPORT: .facop/previous/passport.json
          FACOP_PREVIOUS_ATTESTATION: .facop/previous/passport.att.json
          FACOP_VALIDATED_REASON_PROOF: .facop/validated-reason/validated-reason.json
        run: npm run qualify
      - name: Attest the Evidence Passport
        env:
          FACOP_ATTESTATION_KEY_PEM_FILE: config/reference-attestation-key.pem
        run: |
          set -euo pipefail
          FACOP_ATTESTATION_KEY_PEM="$(cat "$FACOP_ATTESTATION_KEY_PEM_FILE")" node scripts/attest.ts
          node scripts/verify-attestation.ts .facop/evidence/passport.att.json qualification \
            --expect-revision="$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: facop-evidence-passport, path: .facop/evidence }
