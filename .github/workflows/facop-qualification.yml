name: FACoP Qualification Profile
on:
  push:
    branches: ['*-tests', '*-qualification']
permissions:
  contents: read
jobs:
  evidence-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Qualify revision
        env: { FACOP_CHARACTERIZATION_SCALE: 2 }
        run: npm run qualify
      - uses: actions/upload-artifact@v4
        with: { name: facop-evidence-passport, path: .facop/evidence }
